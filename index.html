<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaokê Bar - Votação Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase App e Database SDKs (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .bg-glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .text-glow-pink {
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <main class="flex-grow flex flex-col items-center justify-center p-4">
    <div id="app" class="w-full max-w-md md:max-w-4xl">
      <div class="text-center text-gray-400 py-8">Conectando ao servidor...</div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-500 border-t border-gray-800/50">
    Karaokê Bar System &bull; Votação sem aplicativo
  </footer>

  <script>
    // --- CONFIGURAÇÃO DO FIREBASE ---
    // Substitua estas chaves com as do seu projeto Firebase no console do Firebase se preferir
    const firebaseConfig = {
      databaseURL: "https://karaoke-bar-default-rtdb.firebaseio.com"
    };

    // Inicializa Firebase se houver chave válida, senão usa fallback local
    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase não configurado ou erro de inicialização. Usando modo fallback local.", e);
    }

    // --- ESTADO INICIAL ---
    let state = {
      rodadaAtiva: false,
      cantorAtual: "Aguardando próxima apresentação...",
      musicaAtual: "--",
      tempoRestante: 0,
      rodadaId: 1,
      ranking: {}
    };

    const urlParams = new URLSearchParams(window.location.search);
    const isDJ = urlParams.get('modo') === 'dj';
    let timerInterval = null;

    // Escutar mudanças no Firebase em tempo real
    if (db) {
      db.ref('karaoke_state').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.ranking) state.ranking = {};
          render();
        }
      });
    }

    function saveState(newState) {
      state = newState;
      if (db) {
        db.ref('karaoke_state').set(state);
      } else {
        localStorage.setItem('karaoke_state', JSON.stringify(state));
        render();
      }
    }

    function getVotosLocais() {
      const saved = localStorage.getItem('karaoke_votos');
      return saved ? JSON.parse(saved) : {};
    }

    function registrarVotoLocal(rodadaId, nota) {
      const votos = getVotosLocais();
      votos[rodadaId] = nota;
      localStorage.setItem('karaoke_votos', JSON.stringify(votos));
    }

    // --- RENDERIZAÇÃO ---
    function render() {
      const app = document.getElementById('app');
      if (isDJ) {
        app.innerHTML = renderDJView();
      } else {
        app.innerHTML = renderClienteView();
      }
    }

    function renderClienteView() {
      const votos = getVotosLocais();
      const jaVotou = votos[state.rodadaId] !== undefined;
      const notaDada = votos[state.rodadaId];

      const rankingArray = Object.values(state.ranking || {}).sort((a, b) => b.media - a.media);

      if (!state.rodadaAtiva) {
        return renderPodioERankingCliente(rankingArray);
      }

      if (jaVotou) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-green-500/30">
            <div class="inline-block p-4 rounded-full bg-green-500/10 text-green-400">
              <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-green-400">Voto Confirmado!</h2>
            <p class="text-gray-300 text-sm">
              Sua avaliação de <strong class="text-yellow-400">${notaDada} ★</strong> para 
              <span class="text-pink-400 font-semibold">${state.cantorAtual}</span> foi registrada!
            </p>
          </div>
        `;
      }

      return `
        <div class="bg-glass rounded-3xl p-6 md:p-8 space-y-6 shadow-2xl border border-pink-500/20 text-center">
          <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <span class="text-xs uppercase tracking-wider text-gray-400 font-bold">Rodada #${state.rodadaId}</span>
            <div class="flex items-center space-x-2 text-pink-400 font-mono font-bold text-lg">
              <span>${state.tempoRestante}s</span>
            </div>
          </div>

          <div class="space-y-1">
            <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Cantando agora</p>
            <h2 class="text-3xl font-extrabold text-white text-glow-pink">${state.cantorAtual}</h2>
            <p class="text-sm text-cyan-400 font-medium">${state.musicaAtual}</p>
          </div>

          <div class="pt-4 border-t border-gray-800">
            <p class="text-sm text-gray-300 mb-4">Dê a sua nota de 1 a 5 estrelas:</p>
            <div class="grid grid-cols-5 gap-2">
              ${[1, 2, 3, 4, 5].map(nota => `
                <button onclick="votar(${nota})" 
                  class="flex flex-col items-center justify-center p-3 rounded-2xl bg-gray-800 hover:bg-pink-600 border border-gray-700 hover:border-pink-400 transition-all transform active:scale-95 group">
                  <span class="text-2xl text-yellow-400 group-hover:text-white mb-1">★</span>
                  <span class="text-sm font-bold">${nota}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderPodioERankingCliente(ranking) {
      if (!ranking || ranking.length === 0) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-pink-500/20">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">Karaokê ao Vivo</h1>
            <p class="text-gray-300 text-sm">Aguardando a próxima apresentação!</p>
          </div>
        `;
      }

      const primeiro = ranking[0];
      const segundo = ranking[1];
      const terceiro = ranking[2];
      const demais = ranking.slice(3);

      return `
        <div class="space-y-6">
          <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-400">Placar da Noite</h1>
          </div>
          <div class="grid grid-cols-3 gap-2 items-end pt-4 pb-2">
            <div class="flex flex-col items-center">
              ${segundo ? `<span class="text-xs font-bold text-gray-300 truncate max-w-[90px]">${segundo.cantor}</span><span class="text-[10px] text-yellow-400 mb-1">${segundo.media.toFixed(1)} ★</span><div class="w-full bg-gradient-to-t from-gray-700 to-gray-500 rounded-t-2xl h-24 flex items-center justify-center"><span class="text-2xl font-black text-gray-900">2º</span></div>` : ''}
            </div>
            <div class="flex flex-col items-center">
              ${primeiro ? `<div class="text-yellow-400 text-lg mb-1 animate-bounce">👑</div><span class="text-sm font-extrabold text-white truncate max-w-[100px]">${primeiro.cantor}</span><span class="text-xs font-bold text-yellow-400 mb-1">${primeiro.media.toFixed(1)} ★</span><div class="w-full bg-gradient-to-t from-yellow-600 to-yellow-400 rounded-t-2xl h-32 flex items-center justify-center"><span class="text-3xl font-black text-yellow-950">1º</span></div>` : ''}
            </div>
            <div class="flex flex-col items-center">
              ${terceiro ? `<span class="text-xs font-bold text-amber-600 truncate max-w-[90px]">${terceiro.cantor}</span><span class="text-[10px] text-yellow-400 mb-1">${terceiro.media.toFixed(1)} ★</span><div class="w-full bg-gradient-to-t from-amber-800 to-amber-600 rounded-t-2xl h-20 flex items-center justify-center"><span class="text-xl font-black text-amber-950">3º</span></div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderDJView() {
      const rankingArray = Object.values(state.ranking || {}).sort((a, b) => b.media - a.media);

      return `
        <div class="space-y-6">
          <div class="bg-glass rounded-3xl p-6 border border-purple-500/30">
            <h1 class="text-2xl font-bold text-purple-400 mb-4">Painel do DJ (Online)</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Nome do Cantor</label>
                <input type="text" id="inputCantor" value="${state.cantorAtual === 'Aguardando próxima apresentação...' ? '' : state.cantorAtual}" placeholder="Ex: Maria" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Música</label>
                <input type="text" id="inputMusica" value="${state.musicaAtual === '--' ? '' : state.musicaAtual}" placeholder="Ex: Evidências" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
              </div>
            </div>
            <div class="flex items-center justify-between gap-4">
              <span class="text-xl font-mono text-pink-400 font-bold">${state.tempoRestante}s</span>
              <div class="space-x-2">
                <button onclick="iniciarVotacao()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-4 py-2 rounded-xl text-sm">▶ Abrir Votação</button>
                <button onclick="pausarVotacao()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold px-4 py-2 rounded-xl text-sm">⏸ Encerrar</button>
                <button onclick="proximaRodada()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-sm">⏭ Próxima</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function votar(nota) {
      if (!state.rodadaAtiva) return;
      registrarVotoLocal(state.rodadaId, nota);

      const rId = 'rodada_' + state.rodadaId;
      if (!state.ranking) state.ranking = {};

      let item = state.ranking[rId] || {
        rodadaId: state.rodadaId,
        cantor: state.cantorAtual,
        musica: state.musicaAtual,
        totalVotos: 0,
        somaNotas: 0,
        media: 0
      };

      item.totalVotos += 1;
      item.somaNotas += nota;
      item.media = item.somaNotas / item.totalVotos;

      state.ranking[rId] = item;
      saveState(state);
      confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
    }

    function iniciarVotacao() {
      state.cantorAtual = document.getElementById('inputCantor')?.value || "Cantor";
      state.musicaAtual = document.getElementById('inputMusica')?.value || "Música";
      state.rodadaAtiva = true;
      state.tempoRestante = 60;
      saveState(state);

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.tempoRestante > 0 && state.rodadaAtiva) {
          state.tempoRestante -= 1;
          saveState(state);
        } else {
          pausarVotacao();
        }
      }, 1000);
    }

    function pausarVotacao() {
      clearInterval(timerInterval);
      state.rodadaAtiva = false;
      saveState(state);
    }

    function proximaRodada() {
      pausarVotacao();
      state.rodadaId += 1;
      state.cantorAtual = "Aguardando próxima apresentação...";
      state.musicaAtual = "--";
      state.tempoRestante = 0;
      saveState(state);
    }

    render();
  </script>
</body>
</html>
