<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaokê Bar - Votação Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase SDKs (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .bg-glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .text-glow-pink {
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-grow flex flex-col items-center justify-center p-4">
    <div id="app" class="w-full max-w-md md:max-w-4xl">
      <div class="text-center text-gray-400 py-12">Conectando ao sistema do bar...</div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-500 border-t border-gray-800/50">
    Karaokê Bar System &bull; Votação sem aplicativo
  </footer>

  <script>
    // --- CONFIGURAÇÃO DO FIREBASE ---
    // URL padrão pública gratuita para testes (crie seu próprio projeto no console do firebase.google.com se preferir)
    const firebaseConfig = {
      databaseURL: "https://karaoke-voto-default-rtdb.firebaseio.com/"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Erro ao iniciar Firebase. Usando armazenamento local.", e);
    }

    // --- ESTADO GLOBAL ---
    let state = {
      rodadaAtiva: false,
      cantorAtual: "Aguardando próxima apresentação...",
      musicaAtual: "--",
      tempoRestante: 0,
      rodadaId: 1,
      ranking: {} // Dicionário agrupado por nome do cantor: { "Nome do Cantor": { cantor, totalVotos, somaNotas, media, musicas: [...] } }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const isDJ = urlParams.get('modo') === 'dj';
    let timerInterval = null;

    // Sincronização em tempo real com o Firebase
    if (db) {
      db.ref('karaoke_state').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.ranking) state.ranking = {};
          render();
        }
      });
    }

    function saveState(newState) {
      state = newState;
      if (db) {
        db.ref('karaoke_state').set(state);
      } else {
        localStorage.setItem('karaoke_state', JSON.stringify(state));
        render();
      }
    }

    function getVotosLocais() {
      const saved = localStorage.getItem('karaoke_votos');
      return saved ? JSON.parse(saved) : {};
    }

    function registrarVotoLocal(rodadaId, nota) {
      const votos = getVotosLocais();
      votos[rodadaId] = nota;
      localStorage.setItem('karaoke_votos', JSON.stringify(votos));
    }

    // --- RENDERIZAÇÃO PRINCIPAL ---
    function render() {
      const app = document.getElementById('app');
      if (isDJ) {
        app.innerHTML = renderDJView();
      } else {
        app.innerHTML = renderClienteView();
      }
    }

    // --- INTERFACE DO CLIENTE (MESA) ---
    function renderClienteView() {
      const votos = getVotosLocais();
      const jaVotou = votos[state.rodadaId] !== undefined;
      const notaDada = votos[state.rodadaId];

      const rankingArray = Object.values(state.ranking || {}).sort((a, b) => b.media - a.media);

      if (!state.rodadaAtiva) {
        return renderPodioERankingCliente(rankingArray);
      }

      if (jaVotou) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-green-500/35">
            <div class="inline-block p-4 rounded-full bg-green-500/10 text-green-400">
              <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-green-400">Voto Confirmado!</h2>
            <p class="text-gray-300 text-sm">
              Sua avaliação de <strong class="text-yellow-400">${notaDada} ★</strong> para 
              <span class="text-pink-400 font-semibold">${state.cantorAtual}</span> foi registrada!
            </p>
            <div class="p-4 rounded-2xl bg-gray-900/60 border border-gray-800 text-xs text-gray-400">
              Aguarde o encerramento para ver a classificação geral!
            </div>
          </div>
        `;
      }

      return `
        <div class="bg-glass rounded-3xl p-6 md:p-8 space-y-6 shadow-2xl border border-pink-500/20 text-center">
          <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <span class="text-xs uppercase tracking-wider text-gray-400 font-bold">Rodada #${state.rodadaId}</span>
            <div class="flex items-center space-x-2 text-pink-400 font-mono font-bold text-lg">
              <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>${state.tempoRestante}s</span>
            </div>
          </div>

          <div class="space-y-1">
            <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Cantando agora</p>
            <h2 class="text-3xl font-extrabold text-white text-glow-pink">${state.cantorAtual}</h2>
            <p class="text-sm text-cyan-400 font-medium">${state.musicaAtual}</p>
          </div>

          <div class="pt-4 border-t border-gray-800">
            <p class="text-sm text-gray-300 mb-4">Dê a sua nota de 1 a 5 estrelas:</p>
            <div class="grid grid-cols-5 gap-2">
              ${[1, 2, 3, 4, 5].map(nota => `
                <button onclick="votar(${nota})" 
                  class="flex flex-col items-center justify-center p-3 rounded-2xl bg-gray-800 hover:bg-pink-600 border border-gray-700 hover:border-pink-400 transition-all transform active:scale-95 group">
                  <span class="text-2xl text-yellow-400 group-hover:text-white mb-1">★</span>
                  <span class="text-sm font-bold">${nota}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Componente de Pódio e Ranking para Clientes
    function renderPodioERankingCliente(ranking) {
      if (!ranking || ranking.length === 0) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-pink-500/20">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">
              Karaokê ao Vivo
            </h1>
            <p class="text-gray-300 text-sm">Ainda não temos apresentações registradas.</p>
            <div class="p-4 rounded-2xl bg-gray-900/60 border border-gray-800 text-yellow-400 font-semibold text-sm">
              Aguardando o próximo cantor subir ao palco!
            </div>
          </div>
        `;
      }

      const primeiro = ranking[0];
      const segundo = ranking[1];
      const terceiro = ranking[2];
      const demais = ranking.slice(3);

      return `
        <div class="space-y-6">
          <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-400">
              Placar da Noite
            </h1>
            <p class="text-xs text-gray-400">Classificação unificada dos cantores</p>
          </div>

          <!-- PÓDIO TOP 3 -->
          <div class="grid grid-cols-3 gap-2 items-end pt-4 pb-2">
            
            <!-- 2º Lugar -->
            <div class="flex flex-col items-center">
              ${segundo ? `
                <span class="text-xs font-bold text-gray-300 truncate max-w-[90px]">${segundo.cantor}</span>
                <span class="text-[10px] text-yellow-400 mb-1">${segundo.media.toFixed(1)} ★</span>
                <div class="w-full bg-gradient-to-t from-gray-700 to-gray-500 rounded-t-2xl h-24 flex items-center justify-center shadow-lg border-t border-gray-400">
                  <span class="text-2xl font-black text-gray-900">2º</span>
                </div>
              ` : '<div class="h-24"></div>'}
            </div>

            <!-- 1º Lugar -->
            <div class="flex flex-col items-center">
              ${primeiro ? `
                <div class="text-yellow-400 text-lg mb-1 animate-bounce">👑</div>
                <span class="text-sm font-extrabold text-white truncate max-w-[100px]">${primeiro.cantor}</span>
                <span class="text-xs font-bold text-yellow-400 mb-1">${primeiro.media.toFixed(1)} ★</span>
                <div class="w-full bg-gradient-to-t from-yellow-600 to-yellow-400 rounded-t-2xl h-32 flex items-center justify-center shadow-2xl border-t border-yellow-200">
                  <span class="text-3xl font-black text-yellow-950">1º</span>
                </div>
              ` : '<div class="h-32"></div>'}
            </div>

            <!-- 3º Lugar -->
            <div class="flex flex-col items-center">
              ${terceiro ? `
                <span class="text-xs font-bold text-amber-600 truncate max-w-[90px]">${terceiro.cantor}</span>
                <span class="text-[10px] text-yellow-400 mb-1">${terceiro.media.toFixed(1)} ★</span>
                <div class="w-full bg-gradient-to-t from-amber-800 to-amber-600 rounded-t-2xl h-20 flex items-center justify-center shadow-lg border-t border-amber-400">
                  <span class="text-xl font-black text-amber-950">3º</span>
                </div>
              ` : '<div class="h-20"></div>'}
            </div>

          </div>

          <!-- LISTA COMPLETA -->
          ${demais.length > 0 ? `
            <div class="bg-glass rounded-3xl p-4 border border-gray-800 space-y-2">
              <p class="text-xs uppercase tracking-wider text-gray-400 font-bold mb-2">Outras posições</p>
              ${demais.map((item, idx) => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-gray-900/60 border border-gray-800/80">
                  <div class="flex items-center space-x-3">
                    <span class="text-xs font-bold text-gray-500 w-5">#${idx + 4}</span>
                    <div>
                      <p class="text-sm font-semibold text-white">${item.cantor}</p>
                      <p class="text-[10px] text-gray-400">${item.totalVotos} avaliações totais</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="text-sm font-bold text-yellow-400">${item.media.toFixed(1)} ★</span>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    // --- PAINEL DO DJ ---
    function renderDJView() {
      const rankingArray = Object.values(state.ranking || {}).sort((a, b) => b.media - a.media);

      return `
        <div class="space-y-6">
          <div class="bg-glass rounded-3xl p-6 border border-purple-500/30">
            <div class="flex justify-between items-center mb-6">
              <div>
                <h1 class="text-2xl font-bold text-purple-400">Painel do DJ / Apresentador</h1>
                <p class="text-xs text-gray-400">Sincronizado via Nuvem (Firebase)</p>
              </div>
              <div class="flex items-center space-x-2 bg-gray-900 px-3 py-1.5 rounded-xl border border-gray-800">
                <span class="w-3 h-3 rounded-full ${state.rodadaAtiva ? 'bg-green-500 animate-ping' : 'bg-red-500'}"></span>
                <span class="text-xs font-semibold uppercase">${state.rodadaAtiva ? 'Votação Aberta' : 'Votação Fechada'}</span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Nome do Cantor</label>
                <input type="text" id="inputCantor" value="${state.cantorAtual === 'Aguardando próxima apresentação...' ? '' : state.cantorAtual}" 
                  placeholder="Ex: Maria Souza" 
                  class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Música / Banda</label>
                <input type="text" id="inputMusica" value="${state.musicaAtual === '--' ? '' : state.musicaAtual}" 
                  placeholder="Ex: Como Nossos Pais" 
                  class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-gray-900/60 border border-gray-800">
              <div class="flex items-center space-x-3">
                <span class="text-sm font-semibold text-gray-400">Tempo:</span>
                <span class="text-2xl font-mono font-extrabold text-pink-400">${state.tempoRestante}s</span>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="iniciarVotacao()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ▶ Iniciar Votação
                </button>
                <button onclick="pausarVotacao()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ⏸ Encerrar
                </button>
                <button onclick="proximaRodada()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ⏭ Próxima Rodada
                </button>
              </div>
            </div>
          </div>

          <!-- Placar no Painel do DJ -->
          <div class="bg-glass rounded-3xl p-6 border border-gray-800">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-lg font-bold text-white">Placar Acumulado da Noite</h2>
              <button onclick="limparRanking()" class="text-xs text-red-400 hover:underline">Zerar Ranking</button>
            </div>
            <div class="space-y-3">
              ${rankingArray.length === 0 ? '<p class="text-sm text-gray-500 text-center py-4">Nenhum voto registrado.</p>' : ''}
              ${rankingArray.map((item, idx) => `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-gray-900/60 border border-gray-800">
                  <div class="flex items-center space-x-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500/20 text-pink-400 font-bold flex items-center justify-center text-xs">#${idx + 1}</span>
                    <div>
                      <p class="font-bold text-white text-sm">${item.cantor}</p>
                      <p class="text-xs text-gray-400">${item.totalVotos} votos somados</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="text-lg font-extrabold text-yellow-400">${item.media.toFixed(1)} ★</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- AÇÕES DO SISTEMA ---
    function votar(nota) {
      if (!state.rodadaAtiva) return;

      registrarVotoLocal(state.rodadaId, nota);

      const nomeCantor = state.cantorAtual.trim();
      if (!state.ranking) state.ranking = {};

      // Se o cantor já cantou antes, acumula os pontos na mesma chave do objeto
      let cantorObj = state.ranking[nomeCantor] || {
        cantor: nomeCantor,
        totalVotos: 0,
        somaNotas: 0,
        media: 0
      };

      cantorObj.totalVotos += 1;
      cantorObj.somaNotas += nota;
      cantorObj.media = cantorObj.somaNotas / cantorObj.totalVotos;

      state.ranking[nomeCantor] = cantorObj;

      saveState(state);
      confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
    }

    function iniciarVotacao() {
      const cantor = document.getElementById('inputCantor')?.value.trim() || "Cantor Sem Nome";
      const musica = document.getElementById('inputMusica')?.value.trim() || "Música Livre";

      state.cantorAtual = cantor;
      state.musicaAtual = musica;
      state.rodadaAtiva = true;
      state.tempoRestante = 60;

      saveState(state);

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.tempoRestante > 0 && state.rodadaAtiva) {
          state.tempoRestante -= 1;
          saveState(state);
        } else {
          pausarVotacao();
        }
      }, 1000);
    }

    function pausarVotacao() {
      clearInterval(timerInterval);
      state.rodadaAtiva = false;
      saveState(state);
    }

    function proximaRodada() {
      pausarVotacao();
      state.rodadaId += 1;
      state.cantorAtual = "Aguardando próxima apresentação...";
      state.musicaAtual = "--";
      state.tempoRestante = 0;
      saveState(state);
    }

    function limparRanking() {
      if (confirm("Deseja apagar o ranking acumulado da noite?")) {
        state.ranking = {};
        saveState(state);
      }
    }

    render();
  </script>
</body>
</html>
