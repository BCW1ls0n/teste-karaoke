<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaokê Bar - Votação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .bg-glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .text-glow-pink {
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }
    .text-glow-cyan {
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- CONTEÚDO PRINCIPAL (Troca conforme a URL) -->
  <main class="flex-grow flex flex-col items-center justify-center p-4">
    <div id="app" class="w-full max-w-md md:max-w-4xl"></div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-500 border-t border-gray-800/50">
    Karaokê Bar System &bull; Votação sem aplicativo
  </footer>

  <script>
    // --- ESTADO GLOBAL (Sincronizado via BroadcastChannel e LocalStorage) ---
    const defaultState = {
      rodadaAtiva: false,
      cantorAtual: "Aguardando próxima apresentação...",
      musicaAtual: "--",
      tempoRestante: 0,
      tempoTotal: 60,
      rodadaId: 1,
      ranking: [] // { rodadaId, cantor, musica, totalVotos, somaNotas, media }
    };

    function getState() {
      const saved = localStorage.getItem('karaoke_state');
      return saved ? JSON.parse(saved) : defaultState;
    }

    function saveState(state) {
      localStorage.setItem('karaoke_state', JSON.stringify(state));
      channel.postMessage({ type: 'STATE_UPDATE', state });
      render();
    }

    // Identificador único do dispositivo para travar voto duplicado por rodada
    function getDeviceId() {
      let id = localStorage.getItem('karaoke_device_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        localStorage.setItem('karaoke_device_id', id);
      }
      return id;
    }

    function getVotosLocais() {
      const saved = localStorage.getItem('karaoke_votos');
      return saved ? JSON.parse(saved) : {};
    }

    function registrarVotoLocal(rodadaId, nota) {
      const votos = getVotosLocais();
      votos[rodadaId] = nota;
      localStorage.setItem('karaoke_votos', JSON.stringify(votos));
    }

    // Comunicação entre abas no mesmo navegador
    const channel = new BroadcastChannel('karaoke_channel');
    channel.onmessage = (event) => {
      if (event.data.type === 'STATE_UPDATE') {
        render();
      }
    };

    // Verificar parâmetro na URL (?modo=dj)
    const urlParams = new URLSearchParams(window.location.search);
    const isDJ = urlParams.get('modo') === 'dj';

    // Timer no Painel do DJ
    let timerInterval = null;

    // --- RENDERIZAÇÃO PRINCIPAL ---
    function render() {
      const app = document.getElementById('app');
      const state = getState();

      if (isDJ) {
        app.innerHTML = renderDJView(state);
      } else {
        app.innerHTML = renderClienteView(state);
      }
    }

    // --- INTERFACE DO CLIENTE (MESA) ---
    function renderClienteView(state) {
      const votos = getVotosLocais();
      const jaVotou = votos[state.rodadaId] !== undefined;
      const notaDada = votos[state.rodadaId];

      if (!state.rodadaAtiva) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-pink-500/20">
            <div class="inline-block p-4 rounded-full bg-pink-500/10 text-pink-400 mb-2">
              <svg class="w-12 h-12 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
              </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">
              Karaokê ao Vivo
            </h1>
            <p class="text-gray-300 text-sm">
              Prepare-se! A votação será liberada assim que o cantor iniciar a apresentação no palco.
            </p>
            <div class="p-4 rounded-2xl bg-gray-900/60 border border-gray-800">
              <p class="text-xs text-gray-400">Status do Palco</p>
              <p class="text-lg font-semibold text-yellow-400 mt-1">Aguardando início da rodada...</p>
            </div>
          </div>
        `;
      }

      if (jaVotou) {
        return `
          <div class="bg-glass rounded-3xl p-8 text-center space-y-6 shadow-2xl border border-green-500/30">
            <div class="inline-block p-4 rounded-full bg-green-500/10 text-green-400">
              <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="text-2xl font-bold text-green-400">Voto Confirmado!</h2>
            <p class="text-gray-300 text-sm">
              Sua avaliação de <strong class="text-yellow-400">${notaDada} ★</strong> para 
              <span class="text-pink-400 font-semibold">${state.cantorAtual}</span> foi registrada com sucesso.
            </p>
            <div class="p-4 rounded-2xl bg-gray-900/60 border border-gray-800 text-xs text-gray-400">
              Aguarde a próxima apresentação para votar novamente!
            </div>
          </div>
        `;
      }

      return `
        <div class="bg-glass rounded-3xl p-6 md:p-8 space-y-6 shadow-2xl border border-pink-500/20 text-center">
          <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <span class="text-xs uppercase tracking-wider text-gray-400 font-bold">Rodada #${state.rodadaId}</span>
            <div class="flex items-center space-x-2 text-pink-400 font-mono font-bold text-lg">
              <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>${state.tempoRestante}s</span>
            </div>
          </div>

          <div class="space-y-1">
            <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Cantando agora</p>
            <h2 class="text-3xl font-extrabold text-white text-glow-pink">${state.cantorAtual}</h2>
            <p class="text-sm text-cyan-400 font-medium">${state.musicaAtual}</p>
          </div>

          <div class="pt-4 border-t border-gray-800">
            <p class="text-sm text-gray-300 mb-4">Escolha sua nota de 1 a 5 estrelas:</p>
            <div class="grid grid-cols-5 gap-2">
              ${[1, 2, 3, 4, 5].map(nota => `
                <button onclick="votar(${nota})" 
                  class="flex flex-col items-center justify-center p-3 rounded-2xl bg-gray-800 hover:bg-pink-600 border border-gray-700 hover:border-pink-400 transition-all transform active:scale-95 group">
                  <span class="text-2xl text-yellow-400 group-hover:text-white mb-1">★</span>
                  <span class="text-sm font-bold">${nota}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- PAINEL DO DJ / ORGANIZADOR ---
    function renderDJView(state) {
      return `
        <div class="space-y-6">
          <div class="bg-glass rounded-3xl p-6 border border-purple-500/30">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <h1 class="text-2xl font-bold text-purple-400">Painel do DJ / Apresentador</h1>
                <p class="text-xs text-gray-400">Controle a votação e as apresentações em tempo real</p>
              </div>
              <div class="flex items-center space-x-2 bg-gray-900 px-3 py-1.5 rounded-xl border border-gray-800">
                <span class="w-3 h-3 rounded-full ${state.rodadaAtiva ? 'bg-green-500 animate-ping' : 'bg-red-500'}"></span>
                <span class="text-xs font-semibold uppercase">${state.rodadaAtiva ? 'Votação Aberta' : 'Votação Fechada'}</span>
              </div>
            </div>

            <!-- Formulário do Cantor Atual -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Nome do Cantor</label>
                <input type="text" id="inputCantor" value="${state.cantorAtual === 'Aguardando próxima apresentação...' ? '' : state.cantorAtual}" 
                  placeholder="Ex: João Silva" 
                  class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Música / Banda</label>
                <input type="text" id="inputMusica" value="${state.musicaAtual === '--' ? '' : state.musicaAtual}" 
                  placeholder="Ex: Evidências - Chitãozinho & Xororó" 
                  class="w-full bg-gray-900/80 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
              </div>
            </div>

            <!-- Controles do Cronômetro -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-gray-900/60 border border-gray-800 mb-6">
              <div class="flex items-center space-x-3">
                <span class="text-sm font-semibold text-gray-400">Tempo de Votação:</span>
                <span class="text-2xl font-mono font-extrabold text-pink-400">${state.tempoRestante}s</span>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="iniciarVotacao()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ▶ Iniciar Votação
                </button>
                <button onclick="pausarVotacao()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ⏸ Encerrar
                </button>
                <button onclick="proximaRodada()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                  ⏭ Próxima Rodada
                </button>
              </div>
            </div>
          </div>

          <!-- Ranking da Noite -->
          <div class="bg-glass rounded-3xl p-6 border border-gray-800">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
              <span>Placar da Noite (Ranking)</span>
              <button onclick="limparRanking()" class="text-xs text-red-400 hover:underline">Zerar Ranking</button>
            </h2>

            <div class="space-y-3">
              ${state.ranking.length === 0 ? '<p class="text-sm text-gray-500 text-center py-4">Nenhum voto registrado até o momento.</p>' : ''}
              ${state.ranking.sort((a,b) => b.media - a.media).map((item, idx) => `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-gray-900/60 border border-gray-800">
                  <div class="flex items-center space-x-3">
                    <span class="w-7 h-7 rounded-full bg-pink-500/20 text-pink-400 font-bold flex items-center justify-center text-xs">
                      #${idx + 1}
                    </span>
                    <div>
                      <p class="font-bold text-white text-sm">${item.cantor}</p>
                      <p class="text-xs text-gray-400">${item.musica}</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="text-lg font-extrabold text-yellow-400">${item.media.toFixed(1)} ★</p>
                    <p class="text-xs text-gray-500">${item.totalVotos} voto(s)</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- AÇÕES DO SISTEMA ---
    function votar(nota) {
      const state = getState();
      if (!state.rodadaAtiva) return;

      registrarVotoLocal(state.rodadaId, nota);

      // Atualiza ranking
      let item = state.ranking.find(r => r.rodadaId === state.rodadaId);
      if (!item) {
        item = {
          rodadaId: state.rodadaId,
          cantor: state.cantorAtual,
          musica: state.musicaAtual,
          totalVotos: 0,
          somaNotas: 0,
          media: 0
        };
        state.ranking.push(item);
      }

      item.totalVotos += 1;
      item.somaNotas += nota;
      item.media = item.somaNotas / item.totalVotos;

      saveState(state);

      // Animação de confetes ao votar
      confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
    }

    function iniciarVotacao() {
      const state = getState();
      const cantor = document.getElementById('inputCantor')?.value || "Cantor Sem Nome";
      const musica = document.getElementById('inputMusica')?.value || "Música Livre";

      state.cantorAtual = cantor;
      state.musicaAtual = musica;
      state.rodadaAtiva = true;
      state.tempoRestante = 60; // 60 segundos por padrão

      saveState(state);

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const s = getState();
        if (s.tempoRestante > 0 && s.rodadaAtiva) {
          s.tempoRestante -= 1;
          saveState(s);
        } else {
          pausarVotacao();
        }
      }, 1000);
    }

    function pausarVotacao() {
      clearInterval(timerInterval);
      const state = getState();
      state.rodadaAtiva = false;
      saveState(state);
    }

    function proximaRodada() {
      pausarVotacao();
      const state = getState();
      state.rodadaId += 1;
      state.cantorAtual = "Aguardando próxima apresentação...";
      state.musicaAtual = "--";
      state.tempoRestante = 0;
      saveState(state);
    }

    function limparRanking() {
      if (confirm("Tem certeza que deseja apagar o ranking da noite?")) {
        const state = getState();
        state.ranking = [];
        saveState(state);
      }
    }

    // Inicialização
    render();
  </script>
</body>
</html>
